-
  weight: 0.0475
  query: |
    SELECT g.key, g.value->>'ra', g.value->>'dec', g.value->>'u', g.value->>'g', g.value->>'r', g.value->>'i' AS i, g.value->>'z', g.value->>'psfmagerr_u' as u_err, g.value->>'psfmagerr_g' as g_err, g.value->>'psfmagerr_r' as r_err, g.value->>'psfmagerr_i' as i_err, g.value->>'psfmagerr_z' as z_err, p.value->>'pid', p.value->>'version', p.value->>'z' AS pz, p.value->>'zerr', p.value->>'t', p.value->>'terr', p.value->>'quality', s.value->>'specobjid', s.value->>'ra', s.value->>'dec', s.value->>'z' AS sz 
    FROM PhotoObjAll as g LEFT OUTER JOIN SpecObjAll s ON g.key=(s.value->>'bestobjid')::int8 JOIN Photoz as p ON g.key=p.key 
    WHERE g.key IN ({objidlist}) AND (g.value->>'type')::int8=3 AND (g.value->>'i')::float8 BETWEEN 14.0 AND 21.0 AND (p.value->>'z')::float8 > {z1}
  params: objidlist,z1
-
