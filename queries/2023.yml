-
  weight: 0.0903
  query: |
    SELECT g.value->>'ra' AS ra, g.value->>'dec' AS dec, g.value->>'dered_r', s.value->>'z' AS sz, pz.value->>'z' AS pzz
    FROM PhotoObjAll as g 
      LEFT OUTER JOIN SpecObjAll s ON g.KEY=(s.value->>'bestobjid')::int8
      LEFT OUTER JOIN Photoz as pz ON g.key=pz.KEY
    WHERE (g.value->>'type')::int8=3 
      AND g.key IN ({objidlist})
      AND (pz.value->>'z')::float8 < {z2} AND (pz.value->>'z')::float8 > {z1}
      AND (g.value->>'dered_r')::float8 < {dered_r2} AND (g.value->>'dered_r')::float8 > {dered_r1}
  params: dered_r,z,objidlist
